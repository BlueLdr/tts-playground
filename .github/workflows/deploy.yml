# This workflow will do a clean install of node dependencies, cache/restore them, build the source code and run tests across different versions of node
# For more information see: https://help.github.com/actions/language-and-framework-guides/using-nodejs-with-github-actions

name: Deployment CI

on:
  release:
    types:
      - released

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [14.x]
        # See supported Node.js release schedule at https://nodejs.org/en/about/releases/

    steps:
    - uses: actions/checkout@v4
    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'

    - run: echo "TTS_TAG=${GITHUB_REF/refs\/tags\//}" >> $GITHUB_ENV
    - run: echo "TTS_NAME=${TTS_TAG/-release/}" >> $GITHUB_ENV
    - run: echo "export TTS_VERSION=$TTS_NAME" >> .env
    - run: echo "export TTS_URL=\"${{ vars.TTS_URL }}\"" >> .env
    - run: TTS_RELEASE_VERSION=$TTS_NAME node scripts/ensure-version.js
    - run: TTS_URL="${{ vars.TTS_URL }}" node scripts/ensure-url.js

    - run: npm ci
    - run: npm run build
    - run: npm run test

    - name: Deploy 🚀
      uses: JamesIves/github-pages-deploy-action@4.1.4
      with:
        branch: gh-pages # The branch the action should deploy to.
        folder: dist/ # The folder the action should deploy.
